<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Cue Mixes</title>
  <style>
    :root, [data-theme="dark"] {
      --plate: #141619; --panel: #1d2024; --panel2: #24282d; --well: #101215; --edge: #2c3036;
      --text: #f1f0ec; --dim: #858a93; --silk: #b9bdc5; --grid: #1f2328; --bar: #2f343b;
      --ok: #3ddc84; --bad: #ff5a6a; color-scheme: dark;
    }
    [data-theme="grey"] {
      --plate: #4a4e55; --panel: #555a62; --panel2: #5d626a; --well: #41454b; --edge: #6a6f78;
      --text: #f6f5f1; --dim: #c9ccd1; --silk: #e1e3e6; --grid: #484c53; --bar: #5a5f67;
      --ok: #7ef0ae; --bad: #ff9aa3;
    }
    [data-color="yellow"] { --acc: #ffd23f; --acc2: #f5a623; --ink: #1f1600; }
    [data-color="orange"] { --acc: #ffa94d; --acc2: #ff6b3d; --ink: #1f0c00; }
    [data-color="red"]    { --acc: #ff6b6b; --acc2: #e0334f; --ink: #1f0508; }
    [data-color="green"]  { --acc: #2ee6a6; --acc2: #9be14a; --ink: #0b1a10; }
    [data-color="blue"]   { --acc: #4cc3ff; --acc2: #5b6cff; --ink: #06131f; }
    [data-color="pink"]   { --acc: #ff86c8; --acc2: #ff4f8b; --ink: #1f0612; }
    [data-color="purple"] { --acc: #c08bff; --acc2: #7b5cff; --ink: #12081f; }
    [data-theme="grey"][data-color="yellow"] { --acc: #ffdc66; --acc2: #ffb648; }
    [data-theme="grey"][data-color="orange"] { --acc: #ffbd73; --acc2: #ff8a63; }
    [data-theme="grey"][data-color="red"]    { --acc: #ff8f8f; --acc2: #ff5c74; }
    [data-theme="grey"][data-color="green"]  { --acc: #5ff0bd; --acc2: #b8ee7a; }
    [data-theme="grey"][data-color="blue"]   { --acc: #7fd4ff; --acc2: #8f9bff; }
    [data-theme="grey"][data-color="pink"]   { --acc: #ffa6d6; --acc2: #ff79a8; }
    [data-theme="grey"][data-color="purple"] { --acc: #d4adff; --acc2: #a08bff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--plate); color: var(--text); font: 12.5px/1.35 ui-rounded, "SF Pro Rounded", system-ui, sans-serif; display: flex; flex-direction: column; user-select: none; -webkit-font-smoothing: antialiased; overflow: hidden; }
    button, select, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
    svg { display: block; }
    .top { display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--edge); }
    h1 { flex: 1; white-space: nowrap; margin: 0; font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
    h1 small { font-weight: 600; color: var(--dim); font-size: 10.5px; margin-left: 4px; font-variant-numeric: tabular-nums; cursor: default; }
    .theme { display: flex; background: var(--well); border: 1px solid var(--edge); border-radius: 9px; padding: 2px; }
    .theme button { width: 26px; height: 22px; border: 0; border-radius: 7px; background: none; display: grid; place-items: center; padding: 0; color: var(--dim); }
    .theme button.on { background: var(--panel2); color: var(--text); }
    .theme svg { width: 12px; height: 12px; }
    select { background: var(--well); border: 1px solid var(--edge); border-radius: 8px; padding: 4px 7px; font-size: 12px; font-weight: 700; }
    .colors { position: relative; }
    #colorBtn { width: 30px; height: 28px; border-radius: 9px; border: 1px solid var(--edge); background: var(--well); display: grid; place-items: center; padding: 0; }
    #colorBtn i, .sw { width: 14px; height: 14px; border-radius: 50%; background: linear-gradient(135deg, var(--acc), var(--acc2)); display: block; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
    #colorBtn.open { border-color: var(--acc); }
    .menu { position: absolute; z-index: 30; top: calc(100% + 6px); right: 0; width: 150px; padding: 5px; background: var(--panel2); border: 1px solid var(--edge); border-radius: 12px; box-shadow: 0 16px 40px rgba(0,0,0,.5); display: flex; flex-direction: column; }
    .menu[hidden] { display: none; }
    .menu button { display: flex; align-items: center; gap: 9px; border: 0; background: none; padding: 5px 8px; border-radius: 7px; font-weight: 700; font-size: 12px; text-align: left; }
    .menu button:hover { background: var(--well); }
    .menu button span { flex: 1; }
    .menu button svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; visibility: hidden; }
    .menu button.on svg { visibility: visible; }


    main { flex: 1; min-height: 0; padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; }
    .bar { display: flex; gap: 10px; align-items: center; background: var(--panel); border-radius: 14px; padding: 7px 12px; }
    .bar > label { color: var(--dim); font-size: 10.5px; font-weight: 800; }
    .bar .sp { flex: 1; }
    .seg { display: flex; background: var(--well); border: 1px solid var(--edge); border-radius: 9px; padding: 2px; gap: 2px; }
    .seg button { border: 0; background: none; border-radius: 7px; padding: 4px 9px; font-size: 11.5px; font-weight: 700; color: var(--dim); white-space: nowrap; }
    .seg button:hover { color: var(--text); }
    .seg button.on { background: var(--panel2); color: var(--text); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--acc) 55%, transparent); }
    .pill { border: 1px solid var(--edge); background: var(--well); border-radius: 9px; padding: 5px 10px; font-weight: 800; font-size: 11.5px; white-space: nowrap; }
    .pill:hover { border-color: var(--silk); }
    #cues { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; min-height: 0; }
    .cue { min-width: 0; min-height: 0; border-radius: 16px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; border-top: 3px solid var(--acc); background: linear-gradient(180deg, color-mix(in srgb, var(--acc) 9%, var(--panel)) 0, var(--panel) 90px); }
    .ch { display: flex; align-items: center; gap: 6px; position: relative; }
    .ch input { flex: 1; min-width: 0; background: none; border: 0; font-size: 15px; font-weight: 800; padding: 0; border-bottom: 1px dashed transparent; }
    .ch input:hover { border-bottom-color: var(--edge); } .ch input:focus { outline: none; border-bottom-color: var(--acc); }
    .cn { font-size: 10px; font-weight: 800; color: var(--ink); background: linear-gradient(135deg, var(--acc), var(--acc2)); border-radius: 6px; padding: 2px 6px; border: 0; white-space: nowrap; }
    .lvl { display: grid; grid-template-columns: 1fr 34px; gap: 6px; align-items: center; }
    .mts { display: flex; flex-direction: column; gap: 3px; }
    .mt { height: 5px; border-radius: 3px; background: var(--well); overflow: hidden; }
    .mt i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #3ddc84 0 70%, #ffd23f 85%, #ff5a6a 100%); background-size: var(--mw, 200px) 100%; }
    .vol { font-size: 10.5px; font-weight: 800; color: var(--dim); text-align: right; font-variant-numeric: tabular-nums; cursor: ns-resize; }
    .me { background: var(--well); border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
    .meh { display: flex; justify-content: space-between; align-items: baseline; }
    .meh b { font-size: 12px; } .mv { font-weight: 800; color: var(--acc); font-variant-numeric: tabular-nums; }
    .mine { font-size: 10.5px; color: var(--dim); font-weight: 700; border: 0; background: none; padding: 0; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .me.nomine .mine { color: var(--acc); }
    .me.nomine .mv { opacity: .4; }
    .mine:hover { color: var(--text); text-decoration: underline; }
    .sl { position: relative; height: 6px; border-radius: 3px; background: var(--panel2); cursor: pointer; touch-action: none; }
    .sl i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, var(--acc), var(--acc2)); pointer-events: none; }
    .sl b { position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.5); pointer-events: none; }
    .sl u { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--edge); pointer-events: none; }
    .sl.big { height: 8px; } .sl.big b { width: 14px; height: 14px; margin: -7px 0 0 -7px; }
    .sl.dis { opacity: .35; pointer-events: none; }
    .vsw { align-self: stretch; }
    .vsw button { flex: 1; padding: 3px 6px; font-size: 11px; }
    .rows { display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 2px 2px 2px 0; }
    .gr { display: grid; grid-template-columns: 12px 68px 1fr 28px 20px; gap: 5px; align-items: center; }
    .gr.sub .gl { padding-left: 8px; font-weight: 600; color: var(--dim); }
    .gr.sub { margin-top: -3px; }
    .gr.head .gl { grid-column: 2 / -1; color: var(--dim); }
    .car { width: 12px; height: 16px; padding: 0; border: 0; background: none; color: var(--dim); font-size: 9px; transition: transform .12s; }
    .car.open { transform: rotate(90deg); color: var(--text); }
    .car.tw { color: var(--acc); }
    .car:disabled { visibility: hidden; }
    .gl { font-size: 11px; font-weight: 700; color: var(--silk); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 5px; }
    .gl em { width: 6px; height: 6px; border-radius: 50%; flex: none; }
    .gv { font-size: 10.5px; font-weight: 800; text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
    .m { width: 20px; height: 18px; padding: 0; border-radius: 5px; border: 1px solid var(--edge); background: var(--well); font-size: 9.5px; font-weight: 800; color: var(--dim); }
    .m.on { background: #ffd23f; color: #1f1600; border-color: transparent; }
    .gr.off .gl, .gr.off .gv { opacity: .4; }
    .gr.gm .gl, .gr.gm .sl, .gr.gm .gv { opacity: .4; }
    .empty { color: var(--dim); font-size: 11px; text-align: center; padding: 12px 4px; }
    .cb2 button { width: 100%; border: 0; border-radius: 9px; padding: 7px; font-weight: 800; font-size: 11.5px; background: linear-gradient(90deg, var(--acc), var(--acc2)); color: var(--ink); }
    .cb { display: flex; gap: 6px; }
    .cb button { flex: 1; border: 1px solid var(--edge); background: var(--well); border-radius: 9px; padding: 6px 4px; font-weight: 800; font-size: 11.5px; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .cb .cp.on { color: var(--acc); border-color: color-mix(in srgb, var(--acc) 60%, transparent); }
    .cb .paste:not(:disabled) { border-color: color-mix(in srgb, var(--acc) 50%, var(--edge)); }
    button:disabled { opacity: .35; cursor: default; }
    .pop { position: fixed; z-index: 40; background: var(--panel2); border: 1px solid var(--edge); border-radius: 12px; box-shadow: 0 16px 40px rgba(0,0,0,.5); padding: 6px; }
    .pop[hidden] { display: none; }
    .pal { display: flex; gap: 6px; padding: 2px; }
    .pal button { width: 18px; height: 18px; border-radius: 50%; border: 0; padding: 0; background: linear-gradient(135deg, var(--acc), var(--acc2)); }
    .pal button.on { box-shadow: 0 0 0 2px var(--panel2), 0 0 0 4px var(--text); }
    .plist { max-height: 300px; overflow: auto; display: flex; flex-direction: column; min-width: 200px; }
    .plist label { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 7px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .plist label:hover { background: var(--well); }
    .plist h5 { margin: 6px 6px 2px; font-size: 10px; color: var(--dim); }
    .plist input { accent-color: var(--acc2); margin: 0; }
    .gpick { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; width: 240px; }
    .gpick button { border: 0; border-radius: 7px; padding: 5px 8px; font-size: 11px; font-weight: 800; text-align: left; background: color-mix(in srgb, var(--g) 22%, transparent); color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .gpick .none { grid-column: 1 / -1; background: var(--well); color: var(--dim); }
    #dlg { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.55); display: grid; place-items: center; }
    #dlg[hidden] { display: none; }
    .dl { width: min(900px, calc(100vw - 40px)); height: min(500px, calc(100vh - 40px)); background: var(--panel); border: 1px solid var(--edge); border-radius: 18px; box-shadow: 0 30px 80px rgba(0,0,0,.6); display: grid; grid-template-columns: 1fr 280px; grid-template-rows: auto 1fr auto; gap: 10px 14px; padding: 14px 16px; }
    .dh { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; }
    .dh h3 { margin: 0; font-size: 15px; flex: 1; }
    .clist { overflow: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; align-content: start; }
    .cr { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 9px; background: var(--well); min-width: 0; }
    .cr b { font-size: 12px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .kd { font-size: 9.5px; font-weight: 800; color: var(--dim); width: 64px; flex: none; }
    .chipg { font-size: 10.5px; font-weight: 800; padding: 2px 8px; border-radius: 7px; border: 0; background: color-mix(in srgb, var(--g) 22%, transparent); color: var(--text); box-shadow: inset 0 0 0 1px var(--g); white-space: nowrap; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
    .chipg.none { box-shadow: inset 0 0 0 1px var(--edge); color: var(--dim); background: none; }
    .gside { display: flex; flex-direction: column; gap: 4px; min-height: 0; overflow: auto; }
    .gside h4 { margin: 0 0 2px; font-size: 10.5px; color: var(--dim); }
    .gi { display: flex; align-items: center; gap: 8px; padding: 3px 6px; border-radius: 8px; }
    .gi i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
    .gi input { flex: 1; min-width: 0; background: none; border: 0; font-weight: 800; font-size: 12px; padding: 2px 0; border-bottom: 1px dashed transparent; }
    .gi input:hover { border-bottom-color: var(--edge); } .gi input:focus { outline: none; border-bottom-color: var(--acc); }
    .gi .ct { font-size: 10.5px; color: var(--dim); font-weight: 800; }
    .gi em { font-style: normal; font-size: 9.5px; color: var(--dim); font-weight: 800; border: 1px solid var(--edge); border-radius: 5px; padding: 0 4px; }
    .gi .x { border: 0; background: none; color: var(--dim); font-size: 11px; padding: 0 2px; }
    .gi .x:hover { color: var(--bad); }
    .add { border: 1px dashed var(--edge); background: none; border-radius: 9px; padding: 6px; color: var(--dim); font-weight: 800; font-size: 11.5px; margin-top: 4px; }
    .add:hover { color: var(--acc); border-color: var(--acc); }
    .df { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; }
    .df .hint { flex: 1; color: var(--dim); font-size: 11px; }
    .df button { border: 1px solid var(--edge); background: var(--well); border-radius: 10px; padding: 8px 16px; font-weight: 800; }
    .df .ok { background: linear-gradient(90deg, var(--acc), var(--acc2)); color: var(--ink); border: 0; }
    .foot { padding: 7px 12px; border-top: 1px solid var(--edge); min-height: 31px; }
    .status { font-size: 12px; color: var(--dim); text-align: center; }
    .status.ok { color: var(--ok); } .status.bad { color: var(--bad); }
  </style>
</head>
<body>
  <div class="top">
    <h1>Cue Mixes <small id="ver"></small></h1>
    <button id="help"></button>
    <div class="colors">
      <button id="colorBtn" aria-haspopup="true"><i></i></button>
      <div class="menu" id="colorMenu" hidden></div>
    </div>
    <div class="theme">
      <button data-t="dark" id="tDark"><svg viewBox="0 0 16 16"><path d="M13.5 10.2A6 6 0 0 1 5.8 2.5a6 6 0 1 0 7.7 7.7z" fill="currentColor"/></svg></button>
      <button data-t="grey" id="tGrey"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="currentColor"/></svg></button>
    </div>
    <select id="lang"></select>
  </div>
  <main>
    <section class="bar">
      <label id="sendsLbl"></label><div class="seg" id="sends"></div>
      <span class="sp"></span>
      <button class="pill" id="groupsBtn"></button>
      <button class="pill" id="allFaders"></button>
    </section>
    <section id="cues"></section>
  </main>
  <div class="foot"><div class="status" id="status" role="status"></div></div>
  <div class="pop" id="pop" hidden></div>
  <div id="dlg" hidden>
    <div class="dl">
      <div class="dh"><h3 id="dTitle"></h3><div class="seg" id="dFilter"></div></div>
      <div class="clist" id="dList"></div>
      <div class="gside" id="dGroups"></div>
      <div class="df"><span class="hint" id="dHint"></span><button id="dDone" class="ok"></button></div>
    </div>
  </div>
  <script src="vendor/luna.global.js"></script>
  <script src="copy.js"></script>
  <script src="winfit.js"></script>
  <script src="tour.js"></script>
  <script src="logic.js"></script>
  <script src="main.js"></script>
</body>
</html>
